[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mgallery"
version = "0.1.0"
description = "Image deduplicate script"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = {text = "BSD-3-Clause"}
authors = [{name = "manti"}]
dependencies = [
    "exifread>=3.5.1",
    "humanize>=4.13.0",
    "ipython>=9.6.0",
    "numpy>=2.3.3",
    "pillow>=11.3.0",
    "pre-commit>=4.3.0",
    "pycairo>=1.28.0",
    "PyGObject>=3.54.3",
    "PyGObject-stubs>=2.13.0",
    "rawpy>=0.25.1",
    "redis>=6.4.0",
]

[project.scripts]
mgallery = "mgallery.mgallery:main"

[tool.bandit]
exclude_dirs = [
    "mgallery/settings.py"
]
skips = ["B308"]

[tool.black]
line-length = 120
target_version = ["py313"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.pytest_cache
  | \.ruff_cache
  | \.venv
  | build
)/
'''

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py313"

[tool.ruff.lint]
select = [
    "E", # pycodestyle
    "F", # Pyflakes
    "N", # pep8-naming
    "UP", # pyupgrade
    "B", # flake8-bugbear
    "S", # flake8-bandit
    "A", # flake8-builtins
    "DJ", # flake8-django
    "I", # isort
    "INP", # flake8-no-pep420
    "RUF" # Ruff-specific rules
]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".mypy_cache",
    ".pytype",
    ".ruff_cache",
    ".venv",
    "venv",
    "__pypackages__",
    "mgallery/settings.py"
]
ignore = [
    # Disable eradicate (commented code removal)
    "ERA001",
    # Disable Conflicting lint rules,
    # see https://docs.astral.sh/ruff/formatter/#conflicting-lint-rules
    "W191",
    "E501",
    "E111",
    "E117",
    "D206",
    "D300",
    "Q000",
    "Q001",
    "Q002",
    "Q003",
    "COM812",
    "COM819",
    "ISC001",
    "ISC002",
    "S603",
    # Disable unused `noqa` directive
    "RUF100",
    "RUF012",  # Mutable class attributes should be annotated with `typing.ClassVar`
    "N806",  # Variable `CONSTANT_NAME` in function should be lowercase
    "DJ001",  # Avoid using `null=True` on string-based fields such as `CharField`
]

[tool.ruff.lint.pycodestyle]
ignore-overlong-task-comments = true

[tool.ruff.lint.isort]
section-order = ["future", "standard-library", "django", "third-party", "first-party", "local-folder"]
lines-after-imports = 2

[tool.ruff.lint.isort.sections]
# Group all Django imports into a separate section.
"django" = ["django"]

[tool.ruff.lint.per-file-ignores]
# Ignore "E402", "F403", "F405" (import violations) in __init__.py files.
# Ignore "S" (flake8-bandit) and "N802" (function name should be lowercase) in tests and docs.
# Ignore "RUF" (Ruff-specific rules) and "I" (isort) in migrations.
"__init__.py" = ["E402", "F403", "F405"]
"**/{tests,docs}/*" = ["E402", "F403", "F405", "S", "N802", "N815"]
"**/*test*.py" = ["E402", "F403", "F405", "S", "N802"]
"**/{settings}/*" = ["E402", "F403", "F405"]
"**/migrations/*" = ["RUF", "I"]
