[project]
name = "mgallery"
version = "0.2.1"
description = "Image deduplicate script"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "exifread>=3.5.1",
    "humanize>=4.15.0",
    "ipython>=9.14.0",
    "numpy>=2.4.6",
    "opencv-python>=4.10.0",
    "pillow>=12.2.0",
    "pre-commit>=4.6.0",
    "pycairo>=1.29.0",
    "PyGObject>=3.54.3",
    "PyGObject-stubs>=2.13.0",
    "rawpy>=0.27.0",
    "alembic>=1.15.0",
    "psycopg2-binary>=2.9.0",
    "sqlalchemy>=2.0.0",
    "setuptools>=82.0.1",
    "ty>=0.0.42",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "uv-bump>=0.5.0",
]

[tool.bandit]
exclude_dirs = [
    "mgallery/utils/settings.py",
]
skips = ["B101", "B308", "B703"]

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle
    "F",  # Pyflakes
    "N",  # pep8-naming
    "UP",  # pyupgrade
    "B",  # flake8-bugbear
    "S",  # flake8-bandit
    "BLE",  # flake8-blind-except
    "A",  # flake8-builtins
    "DJ",  # flake8-django
    "I",  # isort
    "INP",  # flake8-no-pep420
    "RUF"  # Ruff-specific rules
]
exclude = [
    ".git",
    ".idea",
    ".vscode",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "stubs",
]
ignore = [
    "DJ001",  # Null values for model char fields
    "ERA001",  # Disable eradicate (commented code removal)
    # Disable Conflicting lint rules,
    # see https://docs.astral.sh/ruff/formatter/#conflicting-lint-rules
    "W191",
    "E501",
    "E111",
    "E117",
    "D206",
    "D300",
    "Q000",
    "Q001",
    "Q002",
    "Q003",
    "COM812",
    "COM819",
    "ISC001",
    "ISC002",
    "S603",
    # Disable unused `noqa` directive
    "RUF100",
    "RUF012",  # Mutable class attributes should be annotated with `typing.ClassVar`
    "N806",  # Variable `CONSTANT_NAME` in function should be lowercase
    "N802",  # Function name should be lowercase (needed for cv2 stubs)
]

[tool.ruff.lint.pycodestyle]
ignore-overlong-task-comments = true

[tool.ruff.lint.isort]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "mgallery",
    "mgallery.library",
    "mgallery.utils",
    "mgallery.services",
    "local-folder",
]
lines-after-imports = 2

[tool.ruff.lint.isort.sections]
"mgallery" = ["mgallery"]
"mgallery.library" = ["mgallery.library"]
"mgallery.utils" = ["mgallery.utils"]
"mgallery.services" = ["mgallery.services"]

[tool.ruff.lint.per-file-ignores]
# Ignore "E402", "F403", "F405" (import violations) in __init__.py files.
# Ignore "S" (flake8-bandit) and "N802" (function name should be lowercase) in tests and docs.
# Ignore "RUF" (Ruff-specific rules) and "I" (isort) in migrations.
"__init__.py" = ["E402", "F403", "F405"]
"**/{tests,docs}/*" = ["E402", "F403", "F405", "S", "N802", "N815"]
"**/*test*.py" = ["E402", "F403", "F405", "S", "N802"]
"**/{library,utils,services}/*" = ["E402", "F403", "F405"]
"**/{settings}/*" = ["E402", "F403", "F405"]
"**/migrations/*" = ["RUF", "I"]

[tool.pytest.ini_options]
log_cli = true
log_cli_format = "%(levelname)s %(asctime)s %(message)s"
asyncio_mode = "auto"
addopts = '-p no:warnings --color=yes'
norecursedirs = '''
.git
.github
.pytest_cache
.ruff_cache
.venv
'''

[tool.ty.src]
exclude = [
    ".git",
    ".idea",
    ".vscode",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "alembic",
]
